services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: metering_billing
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: dev_password
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d metering_billing"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
